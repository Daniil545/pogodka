<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Погодка</title>
<meta name="description" content="Погода в Telegram: настоящий прогноз для любого города.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef2f8; --line:#dde4ee;
  --text:#0f1b2d; --muted:#5b6b82; --accent:#2f6fed; --accent-soft:#e3ecff;
  --cold:#4a90e2; --warm:#f0a03c; --warn:#e8833a; --warn-soft:#fff1e5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c121c; --surface:#141c29; --surface-2:#1b2535; --line:#263246;
    --text:#e8eef7; --muted:#93a2b8; --accent:#6e9bff; --accent-soft:#1d2b47; --warn-soft:#2d2117;
  }
}
:root[data-theme="dark"]{
  --bg:#0c121c; --surface:#141c29; --surface-2:#1b2535; --line:#263246;
  --text:#e8eef7; --muted:#93a2b8; --accent:#6e9bff; --accent-soft:#1d2b47; --warn-soft:#2d2117;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Manrope",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.app{max-width:560px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}

/* поиск */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 44px 0 40px;font:inherit;font-size:15px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ico{position:absolute;left:12px;top:13px;color:var(--muted)}
.geo{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.geo:active{background:var(--surface-2)}
.results{position:absolute;z-index:10;top:50px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);display:none}
.results.show{display:block}
.results button{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.results button:first-child{border-top:0}
.results button:active{background:var(--surface-2)}
.results small{display:block;color:var(--muted);font-size:12px}
.results .empty{padding:12px 14px;color:var(--muted);font-size:14px}

/* недавние */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* главный блок */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;margin-bottom:12px;min-height:210px;display:flex;flex-direction:column;transition:background .4s}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero-top{display:flex;justify-content:space-between;gap:10px;position:relative;z-index:1}
.city{font-size:22px;font-weight:800;line-height:1.2}
.region{font-size:13px;opacity:.85}
.upd{font-size:11px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;white-space:nowrap;height:fit-content}
.now{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:16px;position:relative;z-index:1}
.now svg{width:78px;height:78px;flex:none}
.big{font-size:66px;font-weight:800;line-height:1;letter-spacing:-.04em}
.desc{font-size:17px;font-weight:700}
.feels{font-size:13px;opacity:.88}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);margin-bottom:12px;font-size:13px}
.alert .dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.fact .k{font-size:12px;color:var(--muted);font-weight:600}
.fact .v{font-size:19px;font-weight:800;margin-top:2px}
.fact .s{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:15px;font-weight:800;margin-bottom:10px}
.hscroll{overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.htrack{position:relative;display:flex}
.hcol{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.hcol svg{width:28px;height:28px}
.hcol .tt{font-weight:800;color:var(--text);font-size:14px}
.hcol .pp{font-size:11px;color:var(--accent);font-weight:700;min-height:16px}

.day{display:grid;grid-template-columns:minmax(0,1fr) 28px 36px 26% 36px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.day:first-of-type{border-top:0}
.day b{font-weight:700}
.day .d{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day svg{width:28px;height:28px}
.lo{color:var(--muted);text-align:right}
.hi{font-weight:800}
.range{position:relative;height:6px;border-radius:6px;background:var(--surface-2)}
.range i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--cold),var(--warm))}

.morning{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;margin-bottom:12px}
.morning:active{opacity:.85}
.morning.done{background:var(--accent-soft);color:var(--accent)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

/* Анимации иконок (все циклы кратны 4 с) */
.a-rays{transform-origin:24px 24px;animation:wxSpin 4s linear infinite}
.a-core{transform-box:fill-box;transform-origin:center;animation:wxGlow 4s ease-in-out infinite}
.a-cl{animation:wxDrift 4s ease-in-out infinite}
.a-cl2{animation:wxDrift 4s ease-in-out infinite reverse}
.a-dr{animation:wxFall 1s linear infinite}
.a-fl{animation:wxFlake 2s linear infinite}
.a-fg{animation:wxSlide 4s ease-in-out infinite}
.a-tw{transform-box:fill-box;transform-origin:center;animation:wxTw 2s ease-in-out infinite}
.a-bolt{animation:wxFlash 4s linear infinite}
.wx [class^="a-"]{animation-delay:calc(var(--o,0s) - var(--t,0s))}
@keyframes wxSpin{to{transform:rotate(45deg)}}
@keyframes wxGlow{50%{transform:scale(1.08)}}
@keyframes wxDrift{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}
@keyframes wxFall{0%{transform:translateY(-5px);opacity:0}25%{opacity:1}100%{transform:translateY(5px);opacity:0}}
@keyframes wxFlake{0%{transform:translate(-1px,-5px);opacity:0}25%{opacity:1}50%{transform:translate(1.5px,0)}100%{transform:translate(-1px,5px);opacity:0}}
@keyframes wxSlide{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes wxTw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wxFlash{0%,70%,78%,100%{opacity:1}72%,76%{opacity:.15}}
.day .wx *{animation:none!important}
@media (prefers-reduced-motion: reduce){.wx *{animation:none!important}}
.foot a{color:inherit}

/* загрузка и ошибки */
.skeleton{border-radius:22px;background:var(--surface-2);height:210px;margin-bottom:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.error{padding:28px 18px;text-align:center;color:var(--muted)}
.error button{margin-top:12px;padding:10px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="search">
    <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Найти город" autocomplete="off" enterkeyhint="search" aria-label="Найти город">
    <button class="geo" id="geo" aria-label="Моё местоположение" title="Моё местоположение">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    </button>
    <div class="results" id="results"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="view"><div class="skeleton"></div></div>
</div>

<script>
/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
function haptic(type){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }catch(e){} }
function applyTheme(){
  if(!tg || !tg.colorScheme || !tg.initData) return;   // вне Telegram — тема системы
  document.documentElement.dataset.theme = tg.colorScheme;
  try{ tg.setHeaderColor(tg.colorScheme==="dark" ? "#0c121c" : "#f3f6fa"); tg.setBackgroundColor(tg.colorScheme==="dark" ? "#0c121c" : "#f3f6fa"); }catch(e){}
}
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} applyTheme(); try{ tg.onEvent("themeChanged",applyTheme); }catch(e){} }

/* ---------- Хранение недавних городов (только на этом устройстве) ---------- */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const DEFAULT = {name:"Москва",region:"Россия",lat:55.7558,lon:37.6173,id:524901};
const BOT = "poogodka_bot";
let recent = store.get("recent",[DEFAULT]);
let current = store.get("city",DEFAULT);

/* ---------- Иконки и описания ---------- */
/* Анимированные иконки погоды. Классы a-* двигаются через CSS (см. «Анимации» в стилях). */
function makeIcons(P){
  const cl=(f,s,y=0)=>`<path class="a-cl" d="M14 ${36+y}a8 8 0 0 1-.7-16A11 11 0 0 1 34.5 ${18+y} 8.5 8.5 0 0 1 34 ${36+y}z" fill="${f}"${s?` stroke="${s}" stroke-width="1.5"`:""}/>`;
  const small=`<path class="a-cl" d="M16 38a7 7 0 0 1-.6-14A10 10 0 0 1 34.6 22 7.5 7.5 0 0 1 34 38z" fill="${P.cl}" stroke="${P.clS}" stroke-width="1.5"/>`;
  const star=(x,y,o)=>`<path class="a-tw" style="--o:${o}s" d="M${x} ${y-3}l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="${P.moon}"/>`;
  const svg=b=>`<svg class="wx" viewBox="0 0 48 48">${b}</svg>`;
  return {
    sun: svg(`<g class="a-rays" stroke="${P.sun}" stroke-width="3" stroke-linecap="round"><path d="M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M10.6 37.4l3.5-3.5M33.9 14.1l3.5-3.5"/></g><circle class="a-core" cx="24" cy="24" r="9" fill="${P.sun}"/>`),
    moon: svg(`<path class="a-core" d="M32 34A13 13 0 0 1 20 12a13 13 0 1 0 16 18 13 13 0 0 1-4 4z" fill="${P.moon}"/>${star(38,10,0)}${star(10,32,-1)}`),
    partly: svg(`<circle class="a-core" cx="18" cy="18" r="8" fill="${P.sun}"/>${small}`),
    partlyn: svg(`<path class="a-core" d="M24 22A9 9 0 0 1 16 8a9 9 0 1 0 11 12z" fill="${P.moon}"/>${star(38,8,-.5)}${small}`),
    cloud: svg(`<path class="a-cl2" d="M30 25a5 5 0 0 1 .5-10 7 7 0 0 1 12.5 2.5 4 4 0 0 1-1 7.5z" fill="${P.cl2}" opacity=".75"/>${cl(P.cl2,P.cl2S)}`),
    rain: svg(cl(P.rainCl,P.cl2S,-6)+[0,1,2].map(i=>`<path class="a-dr" style="--o:${-i/3}s" d="M${17+8*i} 35l-2 5" stroke="${P.drop}" stroke-width="3" stroke-linecap="round"/>`).join("")),
    snow: svg(cl(P.snowCl,P.cl2S,-6)+[0,1,2].map(i=>`<circle class="a-fl" style="--o:${-i*2/3}s" cx="${16+8*i}" cy="${i===1?40:37}" r="2.2" fill="${P.flake}"/>`).join("")),
    fog: svg(cl(P.cl2,"",-10)+`<path class="a-fg" d="M10 32h28" stroke="${P.fog}" stroke-width="3" stroke-linecap="round"/><path class="a-fg" style="--o:-2s" d="M14 38h22" stroke="${P.fog}" stroke-width="3" stroke-linecap="round"/>`),
    storm: svg(cl(P.stormCl,P.stormS,-6)+`<path class="a-bolt" d="M25 30l-5 8h5l-3 7 8-10h-5l3-5z" fill="${P.sun}"/>`)
  };
}
const ICONS = makeIcons({sun:"#FFC53D",moon:"#FFD978",cl:"#E6ECF5",clS:"#B9C6D8",cl2:"#D4DDEA",cl2S:"#9FB0C6",rainCl:"#C9D4E4",drop:"#3D8BFF",snowCl:"#DCE4EF",flake:"#7FB2FF",fog:"#9FB0C6",stormCl:"#B8C4D6",stormS:"#8A9BB2"});
function wmo(c){
  if(c===0) return ["Ясно","sun"];
  if(c===1) return ["Малооблачно","partly"];
  if(c===2) return ["Переменная облачность","partly"];
  if(c===3) return ["Пасмурно","cloud"];
  if(c===45||c===48) return ["Туман","fog"];
  if(c>=51&&c<=57) return ["Морось","rain"];
  if(c===61) return ["Небольшой дождь","rain"];
  if(c===63) return ["Дождь","rain"];
  if(c===65) return ["Сильный дождь","rain"];
  if(c===66||c===67) return ["Ледяной дождь","rain"];
  if(c===71) return ["Небольшой снег","snow"];
  if(c===73) return ["Снег","snow"];
  if(c===75) return ["Сильный снег","snow"];
  if(c===77) return ["Снежная крупа","snow"];
  if(c>=80&&c<=82) return ["Ливень","rain"];
  if(c===85||c===86) return ["Снегопад","snow"];
  if(c>=95) return ["Гроза","storm"];
  return ["—","cloud"];
}
function iconKey(code,isDay){ let k=wmo(code)[1]; if(!isDay&&k==="sun") k="moon"; if(!isDay&&k==="partly") k="partlyn"; return k; }
const HERO={sun:["#3d8bf0","#8cc4ff"],moon:["#22355e","#4b6aa8"],partly:["#4a7fd6","#9bbbe8"],partlyn:["#2b4170","#5a76aa"],cloud:["#5d6f8c","#9aa9c0"],rain:["#3c5a86","#7891b8"],snow:["#5a7fb8","#b3c9ea"],fog:["#6b7a90","#a9b4c4"],storm:["#3a4660","#6b7a96"]};
const fmt = n => { n=Math.round(n); return (n>0?"+":n<0?"−":"")+Math.abs(n)+"°"; };
const DIRS=["северный","северо-восточный","восточный","юго-восточный","южный","юго-западный","западный","северо-западный"];
const WDs=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const hhmm = s => s.slice(11,16);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Загрузка прогноза ---------- */
async function load(city){
  current = city; store.set("city",city);
  renderChips();
  const view = document.getElementById("view");
  view.innerHTML = `<div class="skeleton"></div>`;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}`+
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,surface_pressure,is_day`+
    `&hourly=temperature_2m,weather_code,precipitation_probability,is_day`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max`+
    `&timezone=auto&forecast_days=10&wind_speed_unit=ms`;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    render(city, await r.json());
  }catch(e){
    view.innerHTML = `<div class="card error">Не получилось загрузить прогноз.<br>Проверьте интернет.<br><button id="retry">Повторить</button></div>`;
    document.getElementById("retry").onclick = () => load(city);
  }
}

function render(city, W){
  const cur=W.current, D=W.daily, H=W.hourly;
  const k = iconKey(cur.weather_code, cur.is_day);
  const [c1,c2] = HERO[k];
  const mm = Math.round(cur.surface_pressure*0.750062);
  const dir = DIRS[Math.round(cur.wind_direction_10m/45)%8];

  /* предупреждения из самих данных */
  const warns=[];
  if(cur.wind_gusts_10m>=15) warns.push(`Сильный ветер: порывы до ${Math.round(cur.wind_gusts_10m)} м/с.`);
  if(D.temperature_2m_min[0]<=-25) warns.push(`Сильный мороз ночью: до ${fmt(D.temperature_2m_min[0])}.`);
  if(D.temperature_2m_max[0]>=32) warns.push(`Жара днём: до ${fmt(D.temperature_2m_max[0])}.`);
  if(D.weather_code[0]>=95) warns.push("Сегодня возможна гроза.");
  if(D.temperature_2m_min[0]<0 && D.temperature_2m_max[0]>0 && D.precipitation_probability_max[0]>=50) warns.push("Возможна гололедица: осадки и переход через ноль.");

  /* по часам */
  const nowIdx = Math.max(0,H.time.findIndex(t=>t.slice(0,13)===cur.time.slice(0,13)));
  const hs=[];
  for(let i=0;i<25;i++){ const j=nowIdx+i; if(j>=H.time.length) break;
    hs.push({lbl:i===0?"Сейчас":hhmm(H.time[j]),t:i===0?cur.temperature_2m:H.temperature_2m[j],k:iconKey(H.weather_code[j],H.is_day[j]),p:H.precipitation_probability[j]}); }
  const CW=58, CH=48, ts=hs.map(h=>h.t), mn=Math.min(...ts)-1, mx=Math.max(...ts)+1;
  const pts=hs.map((h,i)=>[i*CW+CW/2, CH-7-(h.t-mn)/(mx-mn||1)*(CH-14)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");

  /* по дням */
  const gmin=Math.min(...D.temperature_2m_min), gmax=Math.max(...D.temperature_2m_max);
  const days = D.time.map((t,i)=>{
    const dt=new Date(t+"T12:00");
    const name=i===0?"Сегодня":i===1?"Завтра":WDs[dt.getDay()];
    const lo=D.temperature_2m_min[i], hi=D.temperature_2m_max[i];
    const l=(lo-gmin)/(gmax-gmin||1)*100, r=(hi-gmin)/(gmax-gmin||1)*100;
    return `<div class="day"><div style="min-width:0"><b>${name}</b><span class="d">${dt.getDate()} ${MON[dt.getMonth()]} · ${wmo(D.weather_code[i])[0].toLowerCase()}</span></div>${ICONS[iconKey(D.weather_code[i],1)]}<span class="lo">${fmt(lo)}</span><div class="range"><i style="left:${l}%;right:${100-r}%"></i></div><span class="hi">${fmt(hi)}</span></div>`;
  }).join("");

  const fact=(k,v,s)=>`<div class="fact"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const uv = Math.round(D.uv_index_max[0]||0);

  document.getElementById("view").innerHTML = `
    <div class="hero" style="background:linear-gradient(140deg,${c1},${c2})">
      <div class="hero-top">
        <div><div class="city">${esc(city.name)}</div><div class="region">${esc(city.region||"")}</div></div>
        <div class="upd">в ${hhmm(cur.time)} по местному</div>
      </div>
      <div class="now">${ICONS[k]}<div>
        <div class="big">${fmt(cur.temperature_2m)}</div>
        <div class="desc">${wmo(cur.weather_code)[0]}</div>
        <div class="feels">Ощущается как ${fmt(cur.apparent_temperature)} · днём ${fmt(D.temperature_2m_max[0])}, ночью ${fmt(D.temperature_2m_min[0])}</div>
      </div></div>
    </div>
    ${morningBtn(city)}
    ${warns.map(w=>`<div class="alert"><div class="dot">!</div><div>${w}</div></div>`).join("")}
    <div class="facts">
      ${fact("Ветер",`${Math.round(cur.wind_speed_10m)} м/с`,`${dir}, порывы до ${Math.round(cur.wind_gusts_10m)}`)}
      ${fact("Влажность",`${cur.relative_humidity_2m}%`,`осадки сегодня: ${D.precipitation_probability_max[0]??0}%`)}
      ${fact("Давление",`${mm}`,"мм рт. ст.")}
      ${fact("Восход и закат",hhmm(D.sunrise[0]),`закат в ${hhmm(D.sunset[0])}`)}
    </div>
    <div class="card">
      <h2>На 24 часа</h2>
      <div class="hscroll"><div class="htrack">
        <svg width="${CW*hs.length}" height="${CH}" style="position:absolute;left:0;top:0;pointer-events:none"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}</svg>
        ${hs.map(h=>`<div class="hcol"><div style="height:${CH}px"></div><span class="tt">${fmt(h.t)}</span>${ICONS[h.k]}<span class="pp">${h.p>=20?h.p+"%":""}</span><span>${h.lbl}</span></div>`).join("")}
      </div></div>
    </div>
    <div class="card"><h2>На 10 дней</h2>${days}</div>
    <div class="foot">УФ-индекс сегодня: ${uv} · Данные <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></div>`;
}

/* ---------- «Присылать утром этот город» ---------- */
const inTelegram = !!(tg && tg.initData);
let morning = null;   // город утренней карточки (храним в облаке Telegram)
const same = (a,b) => a && b && Math.abs(a.lat-b.lat)<0.01 && Math.abs(a.lon-b.lon)<0.01;
function morningBtn(city){
  if(!inTelegram) return "";
  return same(morning,city)
    ? `<button class="morning done" id="morning">✓ Этот город приходит утром</button>`
    : `<button class="morning" id="morning">📬 Присылать утром этот город</button>`;
}
function refreshMorningBtn(){
  const b=document.getElementById("morning"); if(!b) return;
  b.outerHTML = morningBtn(current);
}
if(inTelegram && tg.CloudStorage){
  try{ tg.CloudStorage.getItem("morning",(err,val)=>{ if(!err && val){ try{ morning=JSON.parse(val); refreshMorningBtn(); }catch(e){} } }); }catch(e){}
}
function sendMorning(city){
  if(same(morning,city)) return;
  morning = {name:city.name,lat:city.lat,lon:city.lon};
  try{ tg.CloudStorage.setItem("morning",JSON.stringify(morning)); }catch(e){}
  try{ tg.HapticFeedback.notificationOccurred("success"); }catch(e){}
  refreshMorningBtn();
  if(!tg.initDataUnsafe || !tg.initDataUnsafe.query_id){
    // открыто кнопкой внизу чата: отдаём данные боту напрямую (окно закроется само)
    tg.sendData(JSON.stringify({a:"city",name:city.name,region:city.region||"",lat:city.lat,lon:city.lon}));
    return;
  }
  // открыто кнопкой меню: передаём город через ссылку на бота
  const p = v => String(v).replace(".","p");
  const payload = city.id ? "city_"+city.id : "geo_"+p(city.lat)+"_"+p(city.lon);
  tg.openTelegramLink(`https://t.me/${BOT}?start=${payload}`);
  setTimeout(()=>{ try{ tg.close(); }catch(e){} },400);
}
document.getElementById("view").addEventListener("click",e=>{
  if(e.target.closest("#morning")) sendMorning(current);
});

/* ---------- Недавние города ---------- */
function renderChips(){
  const box=document.getElementById("chips");
  box.innerHTML = recent.map((c,i)=>`<button class="chip ${c.lat===current.lat&&c.lon===current.lon?"on":""}" data-i="${i}">${esc(c.name)}</button>`).join("");
}
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  haptic(); load(recent[+b.dataset.i]);
});
function remember(city){
  recent = [city, ...recent.filter(c=>!(c.lat===city.lat&&c.lon===city.lon))].slice(0,6);
  store.set("recent",recent);
}

/* ---------- Поиск города (геокодер Open-Meteo) ---------- */
const q=document.getElementById("q"), res=document.getElementById("results");
let timer, found=[];
q.addEventListener("input",()=>{
  clearTimeout(timer);
  const v=q.value.trim();
  if(v.length<2){ res.classList.remove("show"); return; }
  timer=setTimeout(async()=>{
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=7&language=ru&format=json`);
      const j=await r.json();
      found=(j.results||[]).map(x=>({id:x.id,name:x.name,region:[x.admin1,x.country].filter(Boolean).join(", "),lat:+x.latitude.toFixed(4),lon:+x.longitude.toFixed(4)}));
      res.innerHTML = found.length ? found.map((c,i)=>`<button data-i="${i}">${esc(c.name)}<small>${esc(c.region)}</small></button>`).join("")
        : `<div class="empty">Ничего не нашлось. Попробуйте другое написание.</div>`;
      res.classList.add("show");
    }catch(e){ res.innerHTML=`<div class="empty">Нет связи с поиском.</div>`; res.classList.add("show"); }
  },300);
});
res.addEventListener("click",e=>{
  const b=e.target.closest("button[data-i]"); if(!b) return;
  const city=found[+b.dataset.i];
  haptic(); remember(city); q.value=""; q.blur(); res.classList.remove("show"); load(city);
});
q.addEventListener("keydown",e=>{ if(e.key==="Enter" && found[0] && res.classList.contains("show")){ const c=found[0]; remember(c); q.value=""; q.blur(); res.classList.remove("show"); load(c); } });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) res.classList.remove("show"); });

/* ---------- Моё местоположение ---------- */
document.getElementById("geo").addEventListener("click",()=>{
  if(!navigator.geolocation){ alert("Устройство не умеет определять местоположение."); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    const city={name:"Моё место",region:"по геопозиции",lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)};
    haptic(); remember(city); load(city);
  },()=>{ (tg&&tg.showAlert) ? tg.showAlert("Не удалось определить место. Найдите город через поиск.") : alert("Не удалось определить место."); },{timeout:10000});
});

load(current);
</script>
